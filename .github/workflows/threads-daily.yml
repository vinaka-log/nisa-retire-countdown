name: Threads daily post

# GitHub Actions + Meta Threads API
# 毎日5回 JST:
#   08/10/18/20 = 価値発信（リンクなし・約1/3は失敗談）
#   12          = 教育＋自分リプにURL（誘導1回）

on:
  schedule:
    # 08:00 JST = 23:00 UTC (previous calendar day)
    - cron: "0 23 * * *"
    # 10:00 JST = 01:00 UTC
    - cron: "0 1 * * *"
    # 12:00 JST = 03:00 UTC
    - cron: "0 3 * * *"
    # 18:00 JST = 09:00 UTC
    - cron: "0 9 * * *"
    # 20:00 JST = 11:00 UTC
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print only, do not publish)"
        type: boolean
        default: false
      post_id:
        description: "Optional post id from posts.py (empty = rotate by date+slot)"
        required: false
        default: ""
      slot:
        description: "0=08value 1=10value 2=12cta 3=18value 4=20value"
        required: false
        default: ""

concurrency:
  group: threads-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_AUTO_POST: "true"
      THREADS_PUBLISH_DELAY_SEC: "8"
      THREADS_REPLY_GAP_SEC: "5"
      TZ: Asia/Tokyo
      PYTHONPATH: scripts/threads
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/threads/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/threads/requirements.txt

      - name: Require Threads secrets
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          if [ -z "$THREADS_ACCESS_TOKEN" ] || [ -z "$THREADS_USER_ID" ]; then
            echo "Missing THREADS_ACCESS_TOKEN / THREADS_USER_ID secrets"
            echo "See scripts/threads/README.md"
            exit 1
          fi

      - name: Resolve slot from schedule
        if: github.event_name == 'schedule'
        run: |
          case "${{ github.event.schedule }}" in
            "0 23 * * *") echo "THREADS_SLOT=0" >> "$GITHUB_ENV" ;;
            "0 1 * * *") echo "THREADS_SLOT=1" >> "$GITHUB_ENV" ;;
            "0 3 * * *") echo "THREADS_SLOT=2" >> "$GITHUB_ENV" ;;
            "0 9 * * *") echo "THREADS_SLOT=3" >> "$GITHUB_ENV" ;;
            "0 11 * * *") echo "THREADS_SLOT=4" >> "$GITHUB_ENV" ;;
            *) echo "Could not map schedule to slot: ${{ github.event.schedule }}" >&2 ;;
          esac

      - name: Post to Threads
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--publish)
          fi
          if [ -n "${{ inputs.post_id }}" ]; then
            ARGS+=(--id "${{ inputs.post_id }}")
          fi
          if [ -n "${{ inputs.slot }}" ]; then
            ARGS+=(--slot "${{ inputs.slot }}")
          elif [ -n "${THREADS_SLOT:-}" ]; then
            ARGS+=(--slot "${THREADS_SLOT}")
          fi
          python scripts/threads/post.py "${ARGS[@]}"
