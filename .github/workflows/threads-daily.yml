name: Threads daily post

# GitHub Actions + Meta Threads API
# 毎日10回 JST:
#   生活大喜利3 / 金融・NISA・物価大喜利3 / 雑談2 / 誘導2

on:
  schedule:
    # 08:00 JST = 23:00 UTC (previous day) : slot 0 生活大喜利
    - cron: "0 23 * * *"
    # 09:30 JST = 00:30 UTC : slot 1 金融大喜利
    - cron: "30 0 * * *"
    # 11:00 JST = 02:00 UTC : slot 2 雑談
    - cron: "0 2 * * *"
    # 12:30 JST = 03:30 UTC : slot 3 生活大喜利
    - cron: "30 3 * * *"
    # 14:00 JST = 05:00 UTC : slot 4 金融大喜利
    - cron: "0 5 * * *"
    # 16:00 JST = 07:00 UTC : slot 5 誘導
    - cron: "0 7 * * *"
    # 18:00 JST = 09:00 UTC : slot 6 雑談
    - cron: "0 9 * * *"
    # 19:30 JST = 10:30 UTC : slot 7 生活大喜利
    - cron: "30 10 * * *"
    # 21:00 JST = 12:00 UTC : slot 8 金融大喜利
    - cron: "0 12 * * *"
    # 22:00 JST = 13:00 UTC : slot 9 誘導
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print only, do not publish)"
        type: boolean
        default: false
      post_id:
        description: "Optional post id from ogiri_posts.py / posts.py (empty = rotate by date+slot)"
        required: false
        default: ""
      slot:
        description: "0=08ogiri 1=0930fin 2=11casual 3=1230ogiri 4=14fin 5=16cta 6=18casual 7=1930ogiri 8=21fin 9=22cta"
        required: false
        default: ""

concurrency:
  group: threads-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_AUTO_POST: "true"
      THREADS_PUBLISH_DELAY_SEC: "8"
      THREADS_IMAGE_PUBLISH_DELAY_SEC: "20"
      THREADS_REPLY_GAP_SEC: "5"
      TZ: Asia/Tokyo
      PYTHONPATH: scripts/threads
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 台帳コミットを main に戻すため最新を取得
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/threads/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/threads/requirements.txt

      - name: Require Threads secrets
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          if [ -z "$THREADS_ACCESS_TOKEN" ] || [ -z "$THREADS_USER_ID" ]; then
            echo "Missing THREADS_ACCESS_TOKEN / THREADS_USER_ID secrets"
            echo "See scripts/threads/README.md"
            exit 1
          fi

      - name: Resolve slot from schedule
        if: github.event_name == 'schedule'
        run: |
          case "${{ github.event.schedule }}" in
            "0 23 * * *") echo "THREADS_SLOT=0" >> "$GITHUB_ENV" ;;
            "30 0 * * *") echo "THREADS_SLOT=1" >> "$GITHUB_ENV" ;;
            "0 2 * * *") echo "THREADS_SLOT=2" >> "$GITHUB_ENV" ;;
            "30 3 * * *") echo "THREADS_SLOT=3" >> "$GITHUB_ENV" ;;
            "0 5 * * *") echo "THREADS_SLOT=4" >> "$GITHUB_ENV" ;;
            "0 7 * * *") echo "THREADS_SLOT=5" >> "$GITHUB_ENV" ;;
            "0 9 * * *") echo "THREADS_SLOT=6" >> "$GITHUB_ENV" ;;
            "30 10 * * *") echo "THREADS_SLOT=7" >> "$GITHUB_ENV" ;;
            "0 12 * * *") echo "THREADS_SLOT=8" >> "$GITHUB_ENV" ;;
            "0 13 * * *") echo "THREADS_SLOT=9" >> "$GITHUB_ENV" ;;
            *) echo "Could not map schedule to slot: ${{ github.event.schedule }}" >&2 ;;
          esac

      - name: Post to Threads
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--publish)
          fi
          if [ -n "${{ inputs.post_id }}" ]; then
            ARGS+=(--id "${{ inputs.post_id }}")
          fi
          if [ -n "${{ inputs.slot }}" ]; then
            ARGS+=(--slot "${{ inputs.slot }}")
          elif [ -n "${THREADS_SLOT:-}" ]; then
            ARGS+=(--slot "${THREADS_SLOT}")
          fi
          python scripts/threads/post.py "${ARGS[@]}"

      - name: Commit ogiri/casual ledger and day plan
        if: ${{ success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        run: |
          if git diff --quiet -- scripts/threads/ogiri_ledger.json scripts/threads/casual_ledger.json scripts/threads/day_plans.json; then
            echo "No ledger/day-plan changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/threads/ogiri_ledger.json scripts/threads/casual_ledger.json scripts/threads/day_plans.json
          git commit -m "chore(threads): update ogiri/casual ledger and day plan"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
