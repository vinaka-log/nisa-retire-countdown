name: Threads daily post

# GitHub Actions + Meta Threads API
# 毎日3回 JST（ジブリ大喜利・PRなし）:
#   08 / 12 / 20 = 公式場面写真 + あるあるキャプション

on:
  schedule:
    # 08:00 JST = 23:00 UTC (previous day) : slot 0
    - cron: "0 23 * * *"
    # 12:00 JST = 03:00 UTC : slot 1
    - cron: "0 3 * * *"
    # 20:00 JST = 11:00 UTC : slot 2
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print only, do not publish)"
        type: boolean
        default: false
      post_id:
        description: "Optional post id from ogiri_posts.py / posts.py (empty = rotate by date+slot)"
        required: false
        default: ""
      slot:
        description: "0=08ogiri 1=12ogiri 2=20ogiri"
        required: false
        default: ""

concurrency:
  group: threads-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_AUTO_POST: "true"
      THREADS_PUBLISH_DELAY_SEC: "8"
      THREADS_IMAGE_PUBLISH_DELAY_SEC: "20"
      THREADS_REPLY_GAP_SEC: "5"
      TZ: Asia/Tokyo
      PYTHONPATH: scripts/threads
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 台帳コミットを main に戻すため最新を取得
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/threads/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/threads/requirements.txt

      - name: Require Threads secrets
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          if [ -z "$THREADS_ACCESS_TOKEN" ] || [ -z "$THREADS_USER_ID" ]; then
            echo "Missing THREADS_ACCESS_TOKEN / THREADS_USER_ID secrets"
            echo "See scripts/threads/README.md"
            exit 1
          fi

      - name: Resolve slot from schedule
        if: github.event_name == 'schedule'
        run: |
          case "${{ github.event.schedule }}" in
            "0 23 * * *") echo "THREADS_SLOT=0" >> "$GITHUB_ENV" ;;
            "0 3 * * *") echo "THREADS_SLOT=1" >> "$GITHUB_ENV" ;;
            "0 11 * * *") echo "THREADS_SLOT=2" >> "$GITHUB_ENV" ;;
            *) echo "Could not map schedule to slot: ${{ github.event.schedule }}" >&2 ;;
          esac

      - name: Post to Threads
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--publish)
          fi
          if [ -n "${{ inputs.post_id }}" ]; then
            ARGS+=(--id "${{ inputs.post_id }}")
          fi
          if [ -n "${{ inputs.slot }}" ]; then
            ARGS+=(--slot "${{ inputs.slot }}")
          elif [ -n "${THREADS_SLOT:-}" ]; then
            ARGS+=(--slot "${THREADS_SLOT}")
          fi
          python scripts/threads/post.py "${ARGS[@]}"

      - name: Commit ogiri ledger and day plan
        if: ${{ success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        run: |
          if git diff --quiet -- scripts/threads/ogiri_ledger.json scripts/threads/day_plans.json; then
            echo "No ledger/day-plan changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/threads/ogiri_ledger.json scripts/threads/day_plans.json
          git commit -m "chore(threads): update ogiri ledger and day plan"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
