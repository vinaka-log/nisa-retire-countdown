name: Threads chitchat_gen refill

# chitchat_gen で雑談を APIなし自動追加 → casual_generated.json を commit

on:
  schedule:
    # 毎週月曜 04:00 JST = 日曜 19:00 UTC
    - cron: "0 19 * * 0"
  workflow_dispatch:
    inputs:
      force_count:
        description: "0=refillロジック / 1以上=その件数を強制追加"
        required: false
        default: "0"
      dry_run:
        description: "生成のみ（ファイル書き込み・commitなし）"
        type: boolean
        default: false

concurrency:
  group: threads-casual-refill
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TZ: Asia/Tokyo
      PYTHONPATH: scripts/threads
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run chitchat_gen
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          FORCE="0"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE="${{ inputs.force_count }}"
          fi
          if [ -n "$FORCE" ] && [ "$FORCE" != "0" ]; then
            ARGS+=(--count "$FORCE")
          else
            ARGS+=(--refill)
          fi
          ARGS+=(--seed "$(date +%Y%m%d)")
          python scripts/threads/chitchat_gen.py "${ARGS[@]}"

      - name: Commit generated pool
        if: ${{ success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        run: |
          if git diff --quiet -- scripts/threads/casual_generated.json; then
            echo "No generated pool changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/threads/casual_generated.json
          git commit -m "chore(threads): chitchat_gen refill"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
